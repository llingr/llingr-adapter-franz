name: Integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: integration/go.sum
      # here rather than in CI: this module needs a newer Go than the library's
      - name: go.mod and go.sum are tidy
        working-directory: integration
        run: go mod tidy -diff
      # -count=1: setup-go restores the test cache, and a change that touches no Go file
      # would otherwise pass on a cached result without starting the broker
      - name: Run integration tests
        working-directory: integration
        run: go test -race -count=1 -timeout 10m ./...
